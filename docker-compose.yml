version: "3.9"
services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: smartfilms
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@db:5432/smartfilms
      JWT_SECRET: change-me-in-prod
    volumes:
      - ./backend/app:/app/app
      - ./backend/ml:/app/ml
    depends_on:
      - db
    ports:
      - "8000:8000"

volumes:
  db_data:


